services:
  app:
    build: .
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: guest_service_db
      DB_USERNAME: root
      DB_PASSWORD:
      IAE_API_KEY: 102022400289
      SERVICE_NAME: Guest-Service
      API_VERSION: v1
      CENTRAL_SSO_JWKS_URL: https://iae-sso.virtualfri.id/api/v1/auth/jwks
      CENTRAL_SOAP_AUDIT_URL: https://iae-sso.virtualfri.id/soap/v1/audit
      CENTRAL_RABBITMQ_BRIDGE_URL: https://iae-sso.virtualfri.id/api/v1/messages/publish
      CENTRAL_API_KEY: KEY-MHS-346
      CENTRAL_TEAM_ID: TEAM-11

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: guest_service_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - guest-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 20
  
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
    depends_on:
      - db

volumes:
  guest-db-data: